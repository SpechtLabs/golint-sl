version: 2

project_name: golint-sl

builds:
  - id: golint-sl
    main: ./cmd/golint-sl
    binary: golint-sl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/spechtlabs/golint-sl/internal/version.Version={{ .Version }}
      - -X github.com/spechtlabs/golint-sl/internal/version.Commit={{ .Commit }}
      - -X github.com/spechtlabs/golint-sl/internal/version.Date={{ .CommitDate }}

# Every platform ships as both a tarball and a zip, as every release has.
archives:
  - id: tar
    ids:
      - golint-sl
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: zip
    ids:
      - golint-sl
    formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# One multi-arch image per release on ghcr.io, tagged with the release, its
# major version and latest. A snapshot builds and loads one image per platform
# into the local Docker instead of pushing.
dockers_v2:
  - id: golint-sl
    ids:
      - golint-sl
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/spechtlabs/golint-sl
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "https://github.com/SpechtLabs/golint-sl"
      org.opencontainers.image.description: "SpechtLabs best practices for writing good Go code"

# Publish to SpechtLabs/homebrew-tap using HOMEBREW_TAP_GITHUB_TOKEN, a
# repository or organization Actions secret with Contents: read and write
# access to the tap. The default GITHUB_TOKEN only has access to this repo.
homebrew_casks:
  - name: golint-sl
    # The cask installs from the tarballs.
    ids:
      - tar
    repository:
      owner: SpechtLabs
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://golint.specht-labs.de"
    description: "SpechtLabs Go linter collection for production code patterns."
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@specht-labs.de
    # golint-sl is not Apple-notarized. Remove quarantine from the installed
    # binary so Gatekeeper allows it to run, as with the other CLIs in the tap.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/golint-sl"]
          end

# release-please writes the changelog and creates the GitHub release; GoReleaser
# only attaches the artifacts to it.
changelog:
  disable: true

# A keyless cosign signature over checksums.txt, as a Sigstore bundle, covers
# every archive through its checksum. `artifacts: binary` would sign nothing:
# it only matches binaries released on their own, and ours ship in archives.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

# Keyless cosign signatures for the images, by digest.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes

release:
  github:
    owner: spechtlabs
    name: golint-sl
  mode: keep-existing
