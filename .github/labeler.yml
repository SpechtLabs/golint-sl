# Analyzer-related files
analyzers:
  - changed-files:
      - any-glob-to-any-file:
          - 'analyzers/**'
          - 'clockinterface/**'
          - 'closurecomplexity/**'
          - 'contextfirst/**'
          - 'contextlogger/**'
          - 'contextpropagation/**'
          - 'dataflow/**'
          - 'emptyinterface/**'
          - 'errorwrap/**'
          - 'exporteddoc/**'
          - 'functionsize/**'
          - 'goroutineleak/**'
          - 'hardcodedcreds/**'
          - 'httpclient/**'
          - 'humaneerror/**'
          - 'interfaceconsistency/**'
          - 'lifecycle/**'
          - 'mockverify/**'
          - 'nestingdepth/**'
          - 'nilcheck/**'
          - 'nopanic/**'
          - 'optionspattern/**'
          - 'pkgnaming/**'
          - 'reconciler/**'
          - 'resourceclose/**'
          - 'returninterface/**'
          - 'sentinelerrors/**'
          - 'sideeffects/**'
          - 'statusupdate/**'
          - 'syncaccess/**'
          - 'todotracker/**'
          - 'wideevents/**'

# CLI-related files
cli:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/**'

# The golangci-lint module plugin and the analyzer list it registers
plugin:
  - changed-files:
      - any-glob-to-any-file:
          - 'golangcilint.go'
          - '.golangci.example.yml'

# Internal packages
internal:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/**'

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*_test.go'
          - '**/testdata/**'

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'doc/**'
          - '**/*.md'

# Build system files
build:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'Dockerfile.goreleaser'
          - '.goreleaser.yaml'
          - '.release-please-config.json'
          - '.release-please-manifest.json'
          - '.mise.toml'
          - '.golangci.yaml'
          - '.custom-gcl.yml'
          - '.pre-commit-config.yaml'
          - '.pre-commit-hooks.yaml'
          - '.markdownlint-cli2.yaml'
          - '.yamllint.yaml'
          - '.editorconfig'
          - 'codecov.yml'
          - 'go.mod'
          - 'go.sum'
          - 'renovate.json'

# Add 'enhancement' to any PR whose head branch starts with `feat` or `feature`
enhancement:
  - head-branch:
      - '^feat'
      - '^feature'

# Add 'bug' label to any PR where the head branch name starts with `bug` or `fix`
bug:
  - head-branch:
      - '^bug'
      - '^fix'
