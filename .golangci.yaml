# golangci-lint configuration for golint-sl.
#
# golint-sl runs as a module plugin baked into ./custom-gcl (see .custom-gcl.yml,
# which builds it from this working tree). The prebuilt golangci-lint cannot
# load the plugin, so run it with `mise run lint`, which builds custom-gcl and
# runs it.
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional recommended linters
    - dogsled
    - copyloopvar
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - whitespace
    - unconvert
    - unparam

    # golint-sl: production-ready Go patterns (error handling, observability, safety)
    # https://golint.specht-labs.de/
    - golint-sl

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    custom:
      golint-sl:
        type: module
        description: SpechtLabs Go linter collection for production-ready code
        original-url: github.com/spechtlabs/golint-sl

  exclusions:
    generated: lax
    rules:
      # Hold test files to a lighter bar than production code.
      - linters:
          - gosec
          - goconst
          - golint-sl
        path: _test\.go

      - linters:
          - govet
        text: "^fieldalignment:"
        path: _test\.go

      # Every analyzer works on what go/analysis hands it: the pass, and the
      # syntax nodes, types and objects the parser and the type checker built.
      # None of them is ever nil, and the helpers they pass them to share that
      # contract; returning quietly on nil would hide a bug rather than
      # prevent one.
      - linters:
          - golint-sl
        text: "^nilcheck:"
        path: (^|/)(analyzer\.go|internal/nolint/nolint\.go)$

      # go/analysis fixes the signature of an analyzer's run function:
      # func(*analysis.Pass) (any, error).
      - linters:
          - golint-sl
        text: '^emptyinterface: function "run" returns'
        path: (^|/)analyzer\.go$

      # golangci-lint's module plugin API fixes these: New and BuildAnalyzers
      # implement register.NewPlugin and register.LinterPlugin, which return
      # plain errors.
      - linters:
          - golint-sl
        text: "^(humaneerror|errorwrap):"
        path: ^golangcilint\.go$

      # golint-sl ships as a golangci-lint plugin, and humane-errors-go would
      # bring zap and testify into every custom-gcl build's module graph for
      # the standalone CLI's config errors. They wrap with fmt.Errorf instead.
      - linters:
          - golint-sl
        text: "^humaneerror:"
        path: ^internal/config/

      # The package names and the exported types below are the public API that
      # .custom-gcl.yml users and code importing the analyzers compile against;
      # renaming them would break both.
      - linters:
          - golint-sl
        text: '^pkgnaming: package name "(analyzers|hardcodedcreds|sentinelerrors|sideeffects|syncaccess|wideevents)" appears to be plural'
      - linters:
          - golint-sl
        text: '^pkgnaming: type (contextlogger\.ContextLoggerInfo|contextpropagation\.ContextPropagationInfo|lifecycle\.LifecycleInfo|reconciler\.ReconcilerInfo) stutters'
      - linters:
          - golint-sl
        text: '^mockverify: mock "MockInfo"'
        path: ^mockverify/
      - linters:
          - golint-sl
        text: '^optionspattern: function "AnalyzeOptionPatterns"'
        path: ^optionspattern/

    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
