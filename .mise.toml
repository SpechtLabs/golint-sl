# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below define how golint-sl is built and checked. CI uses these
# tasks. Renovate keeps every pin in this file current.

# mise reads the go directive of go.mod as the Go version to use, which is
# only the minimum language version, not the toolchain. Every tool comes from
# this file only.
[settings]
idiomatic_version_file_enable_tools = []

[tools]
# The go directive in go.mod is the minimum language version, bumped by hand;
# this is the toolchain everything runs on.
go = "1.27.2"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"

# Pre-commit for Git hooks
pre-commit = "4.6.2"

# Linters. golangci-lint must match the version in .custom-gcl.yml; Renovate
# groups the two into one PR.
golangci-lint = "2.14.0"
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't. The shell-lint task checks the pre-commit
# hook script with it too.
shellcheck = "0.11.0"

# Release tooling. GoReleaser signs the checksums and the container images
# with cosign.
goreleaser = "2.18.2"
cosign = "3.1.3"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.0"

# Documentation website (doc/): VuePress builds under bun, and bun runs
# .github/commit-lint, the squash commit message check in pr-hygiene.yaml.
# markdownlint-cli2 is an npm package, which mise installs with node.
bun = "1.4.2"
node = "24.21.0"
markdownlint-cli2 = "0.23.3"

[tasks.build]
description = "Build the golint-sl binary into bin/"
run = "go build -o bin/golint-sl ./cmd/golint-sl/"

[tasks.test]
description = "Run the test suite with race detector and coverage"
run = "go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.txt ./..."

# `mise run fmt` rewrites everything that has a canonical form; `mise run
# lint` checks the same things without touching a file. go mod tidy runs
# first, because it may rewrite go.mod.
[tasks.fmt]
description = "Format everything: go.mod, Go sources and Markdown"
run = [
  { task = "go-tidy" },
  { task = "go-fmt" },
  { task = "md-fmt" },
]

[tasks.go-tidy]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

# The same gofmt and goimports settings `mise run lint` checks, read from
# .golangci.yaml.
[tasks.go-fmt]
description = "Format Go sources with the formatters configured for golangci-lint"
run = "golangci-lint fmt"

[tasks.md-fmt]
description = "Fix what markdownlint can fix in the documentation and the README"
run = "markdownlint-cli2 --fix 'doc/**/*.md' '*.md'"

# golint-sl runs as a golangci-lint module plugin, so it has to be compiled into
# a custom binary (./custom-gcl). .custom-gcl.yml builds it from this working
# tree rather than a release, so golint-sl lints itself with the analyzers as
# they are now, and the build proves the plugin still registers. That makes
# the Go sources inputs of the build too.
[tasks.lint-build]
description = "Build the custom-gcl binary with this tree's golint-sl plugin baked in"
# The build downloads golangci-lint's whole dependency tree, and the module
# proxy sometimes resets the HTTP/2 stream partway through. Modules already
# downloaded stay in the cache, so a retry picks up where it failed.
run = """
for attempt in 1 2 3; do
  golangci-lint custom && exit 0
  echo "golangci-lint custom failed (attempt $attempt of 3)" >&2
  sleep 10
done
exit 1
"""
sources = [".custom-gcl.yml", "go.mod", "go.sum", "**/*.go"]
outputs = ["custom-gcl"]

# GoReleaser builds the tagged tree as it is, and golangci-lint custom resolves
# against go.mod as it's tagged, so an untidy go.mod has to fail CI rather than
# ship in a release.
[tasks.mod-tidy]
description = "Check that go.mod and go.sum are tidy"
run = "go mod tidy -diff"

[tasks.lint]
description = "Lint the module with golangci-lint and golint-sl, YAML, workflows and the hook script"
depends = ["lint-build", "yaml-lint", "actionlint", "shell-lint"]
run = [{ task = "go-lint" }]

# go-lint runs a custom-gcl that's already built; CI's cached path calls it
# directly. The example config is what the docs tell users to start from, so
# it has to load and enable the plugin.
[tasks.go-lint]
description = "Lint the module with the custom-gcl binary lint-build wrote"
run = [
  "./custom-gcl run ./...",
  "./custom-gcl linters -c .golangci.example.yml | grep -q golint-sl",
]

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.shell-lint]
description = "Lint the pre-commit hook script with shellcheck"
run = "shellcheck hooks/golint-sl.sh"

[tasks.release-check]
description = "Validate the GoReleaser config"
run = "goreleaser check"

# Builds the archives and the container images (with Docker) as a release
# would, without publishing or signing anything.
[tasks.snapshot]
description = "Build a local GoReleaser snapshot, archives and container images, into dist/"
run = "goreleaser release --snapshot --clean --skip=sign"

[tasks.check]
description = "The definition of done: every gate CI runs on the Go code"
depends = [
  "lint",
  "mod-tidy",
  "test",
  "release-check",
]

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run -e 'SpechtLabs/StaticPages-Upload'"

[tasks.docs-lint]
description = "Lint the documentation markdown and the README (the docs workflow's first job)"
run = "markdownlint-cli2 'doc/**/*.md' '*.md'"

[tasks.docs-dev]
description = "Serve the documentation website locally with hot reload"
dir = "doc"
run = ["bun install", "bun run dev"]

[tasks.docs-build]
description = "Build the documentation website (the docs workflow's second job)"
dir = "doc"
run = ["bun install --frozen-lockfile", "bun run build"]
