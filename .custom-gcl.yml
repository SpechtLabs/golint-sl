# golangci-lint v2 custom binary configuration
#
# Builds ./custom-gcl: golangci-lint with golint-sl baked in as a module plugin.
# `mise run lint` builds and runs it. Renovate keeps `version` current, in
# lockstep with golangci-lint in .mise.toml.
#
# Unlike the projects that use golint-sl, this repository builds the plugin from
# its own working tree (`path: .`) rather than a release, so golint-sl lints
# itself with the analyzers as they are now, and a change that breaks the
# plugin's registration fails the build. Projects using golint-sl pin a
# release instead; see https://golint.specht-labs.de/guides/golangci-lint.html

version: v2.14.0

plugins:
  - module: "github.com/spechtlabs/golint-sl"
    import: "github.com/spechtlabs/golint-sl"
    path: .
