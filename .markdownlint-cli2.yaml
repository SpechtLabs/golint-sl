config:
  # Default state for all rules
  default: true

  # MD010: Go snippets are gofmt-formatted and indent with tabs.
  MD010:
    code_blocks: false

  # MD013: Disable line length rule
  MD013: false
  # MD024: Allow duplicate headings in different sections
  MD024: false
  MD038: false
  # MD060: Disable table column style checks
  MD060: false

  # MD040: Every fenced code block needs a language tag.
  MD040: true

# The documentation website and the README are what this config governs, and
# the docs workflow's markdownlint job runs the same globs.
globs:
  - "doc/**/*.md"
  - "*.md"

ignores:
  - "**/node_modules/**"
  # Written by release-please.
  - CHANGELOG.md
