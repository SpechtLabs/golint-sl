# Codecov fails a pull request when the lines it changes are less than 85%
# covered, or when it lowers the project's coverage. The project target follows
# the base branch (auto) rather than a fixed 85%, because only three of the
# analyzers have tests yet and the project sits far below it; raise it to 85%
# once the project gets there.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 85%
